<template>
    <lightning-card title="🎨 Magic Box Game">
        <div class="box" style="width:100px; height:100px; background-color:lightblue;"></div>
        <br />
        <lightning-button label="🎨 Change Color" onclick={changeColor}></lightning-button>
        <lightning-button label="⬆️ Grow" onclick={growBox} class="s-button"></lightning-button>
        <lightning-button label="🫥 Hide" onclick={hideBox} class="s-button"></lightning-button>
        <lightning-button label="Reset" onclick={reset} class="s-button"></lightning-button>
        <lightning-slider label="size" min="50" max="300" step="10" value={boxSize} onchange={slider}></lightning-slider>
    </lightning-card>
</template>
